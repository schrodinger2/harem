<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Prep Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brown-dark:   #3B2314;
    --brown-mid:    #6B3A2A;
    --brown-light:  #A0522D;
    --brown-pale:   #D4A57A;
    --cream:        #F5ECD7;
    --green-dark:   #2C4A2E;
    --green-mid:    #4A7C59;
    --green-light:  #7DAE8A;
    --green-pale:   #C8E6C9;
    --red-dark:     #7B2020;
    --red-pale:     #F5C0C0;
    --white:        #FDFAF4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--cream);
    background-image:
      radial-gradient(ellipse at 10% 20%, rgba(107,58,42,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 80%, rgba(74,124,89,0.08) 0%, transparent 50%);
    min-height: 100vh;
    font-family: 'Lato', sans-serif;
    color: var(--brown-dark);
    padding: 20px 16px 60px;
  }

  header {
    text-align: center;
    padding: 36px 20px 24px;
    max-width: 720px;
    margin: 0 auto 32px;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    color: var(--brown-dark);
    letter-spacing: 0.02em;
    line-height: 1.2;
  }

  header h1 span {
    color: var(--green-mid);
  }

  .progress-bar-wrap {
    max-width: 720px;
    margin: 0 auto 28px;
    padding: 0 4px;
  }
  .jump-controls,
  .music-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin: 20px auto;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--brown-mid);
    margin-bottom: 7px;
  }

  .progress-track {
    height: 7px;
    background: var(--brown-pale);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green-mid), var(--green-dark));
    border-radius: 99px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }

  .card {
    background: var(--white);
    border-radius: 18px;
    box-shadow: 0 4px 24px rgba(59,35,20,0.10), 0 1px 4px rgba(59,35,20,0.06);
    max-width: 720px;
    margin: 0 auto;
    padding: 36px 32px 28px;
    position: relative;
    animation: cardIn 0.45s cubic-bezier(.4,0,.2,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(22px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .q-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }

  .q-badge {
    background: var(--green-mid);
    color: #fff;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 11px;
    border-radius: 99px;
  }

  .q-badge.tf { background: var(--brown-light); }

  .q-number {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--brown-pale);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .question-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    line-height: 1.65;
    color: var(--brown-dark);
    margin-bottom: 28px;
    white-space: pre-wrap;
  }

  .options-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .option-btn {
    width: 100%;
    text-align: left;
    background: #fff;
    border: 2px solid var(--brown-pale);
    border-radius: 12px;
    padding: 14px 18px;
    font-family: 'Lato', sans-serif;
    font-size: 0.97rem;
    color: var(--brown-dark);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 13px;
    transition: border-color 0.18s, background 0.18s, transform 0.14s, box-shadow 0.18s;
    position: relative;
    overflow: hidden;
  }

  .option-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: currentColor;
    opacity: 0;
    transition: opacity 0.18s;
    pointer-events: none;
    border-radius: inherit;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--green-mid);
    background: #f6faf6;
    transform: translateX(4px);
    box-shadow: 0 2px 12px rgba(74,124,89,0.13);
  }

  .option-btn:active:not(:disabled) {
    transform: translateX(2px) scale(0.99);
  }

  .option-letter {
    min-width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--cream);
    border: 2px solid var(--brown-pale);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--brown-mid);
    transition: background 0.18s, border-color 0.18s, color 0.18s;
    flex-shrink: 0;
  }

  /* Correct */
  .option-btn.correct {
    border-color: var(--green-mid);
    background: var(--green-pale);
    animation: pulse-green 0.45s ease;
  }
  .option-btn.correct .option-letter {
    background: var(--green-mid);
    border-color: var(--green-mid);
    color: #fff;
  }

  @keyframes pulse-green {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.025) translateX(4px); }
    100% { transform: scale(1) translateX(4px); }
  }

  /* Wrong */
  .option-btn.wrong {
    border-color: var(--red-dark);
    background: var(--red-pale);
    animation: shake 0.4s ease;
  }
  .option-btn.wrong .option-letter {
    background: var(--red-dark);
    border-color: var(--red-dark);
    color: #fff;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%     { transform: translateX(-6px); }
    40%     { transform: translateX(6px); }
    60%     { transform: translateX(-4px); }
    80%     { transform: translateX(4px); }
  }

  /* Explanation box */
  .explanation {
    margin-top: 20px;
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 0.93rem;
    line-height: 1.6;
    display: none;
    animation: fadeSlideIn 0.35s ease both;
  }

  .explanation.show { display: block; }

  .explanation.correct-exp {
    background: #e8f5e9;
    border-left: 4px solid var(--green-mid);
    color: var(--green-dark);
  }

  .explanation.wrong-exp {
    background: #fdecea;
    border-left: 4px solid var(--red-dark);
    color: var(--red-dark);
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .explanation strong {
    display: block;
    margin-bottom: 5px;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.75;
  }

  /* Nav buttons */
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
    gap: 12px;
  }

  .btn {
    padding: 12px 26px;
    border-radius: 10px;
    border: none;
    font-family: 'Lato', sans-serif;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: background 0.18s, transform 0.14s, box-shadow 0.18s;
  }

  .btn:active { transform: scale(0.97); }

  .btn-prev {
    background: var(--cream);
    border: 2px solid var(--brown-pale);
    color: var(--brown-mid);
  }
  .btn-prev:hover { background: var(--brown-pale); color: var(--brown-dark); }

  .btn-next {
    background: var(--green-mid);
    color: #fff;
    box-shadow: 0 3px 12px rgba(74,124,89,0.3);
  }
  .btn-next:hover { background: var(--green-dark); box-shadow: 0 4px 18px rgba(44,74,46,0.35); }

  .btn:disabled {
    opacity: 0.35;
    cursor: default;
    transform: none;
    box-shadow: none;
  }

  /* Score screen */
  .score-screen {
    text-align: center;
    padding: 48px 24px 36px;
    animation: cardIn 0.45s ease both;
  }

  .score-emoji { font-size: 3.5rem; margin-bottom: 16px; }

  .score-title {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--brown-dark);
    margin-bottom: 8px;
  }

  .score-num {
    font-size: 3.5rem;
    font-weight: 700;
    color: var(--green-mid);
    line-height: 1;
    margin: 16px 0 6px;
  }

  .score-sub {
    color: var(--brown-light);
    font-size: 0.95rem;
    margin-bottom: 32px;
  }

  .btn-restart {
    background: var(--brown-mid);
    color: #fff;
    padding: 14px 36px;
    border-radius: 12px;
    font-size: 1rem;
    box-shadow: 0 4px 14px rgba(107,58,42,0.3);
  }
  .btn-restart:hover { background: var(--brown-dark); }

  @media (max-width: 480px) {
    .card { padding: 24px 16px 20px; }
    .btn { padding: 11px 18px; font-size: 0.85rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Exam <span>Prep</span> Quiz</h1>
</header>
<div class="music-controls">
    <button class="btn btn-next" id="music-btn">
        🎵 Play Music
    </button>

    <audio id="bg-music" src="music.mp3"></audio>
</div>
<div class="progress-bar-wrap">
  <div class="progress-meta">
    <span id="prog-text">Question 1 of 0</span>
    <span id="score-text">Score: 0</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
</div>
<div class="jump-controls">
    <button class="btn btn-prev" onclick="jumpQuestions(-50)">← -50</button>

    <input
        type="number"
        id="jump-input"
        min="1"
        max="${QUESTIONS.length}"
        placeholder="Question #"
    >

    <button class="btn btn-next" onclick="jumpToQuestion()">Go</button>

    <button class="btn btn-next" onclick="jumpQuestions(50)">+50 →</button>
</div>
<div class="card" id="card"></div>

<script>
// ── PASTE YOUR JSON HERE ──────────────────────────────────────────────
// Replace the array below with your full questions array.
// The file expects each question to have:
//   question_number, type, question, options[], correct, explanation
const QUESTIONS = [
  {
    "question_number": 1,
    "type": "mcq",
    "question": "The basic functions of the management process include all of the following EXCEPT\n________.",
    "options": [
      "planning",
      "organizing",
      "outsourcing",
      "leading"
    ],
    "correct": "C",
    "explanation": "C) The five basic functions of the management process include planning, organizing, staffing, leading, and controlling. Outsourcing jobs may be an aspect of human resources, but it is not one of the primary management functions."
  },
  {
    "question_number": 2,
    "type": "mcq",
    "question": "Which of the following is the person responsible for accomplishing an organization's goals by\nmanaging the efforts of the organization's people?",
    "options": [
      "manager",
      "entrepreneur",
      "generalist",
      "marketer"
    ],
    "correct": "A",
    "explanation": "A) The manager is the person responsible for accomplishing an organization's goals by planning, organizing, staffing, leading, and controlling the efforts of the organization's people. An entrepreneur may manage people or may hire a manager to do so instead, but entrepreneurs are defined as individuals who start their own businesses."
  },
  {
    "question_number": 3,
    "type": "mcq",
    "question": "Which of the following includes five basic functions—planning, organizing, staffing, leading,\nand controlling?",
    "options": [
      "a job analysis",
      "strategic management",
      "the management process",
      "adaptability screening"
    ],
    "correct": "C",
    "explanation": "C) The management process includes five basic functions—planning, organizing, staffing, leading, and controlling. Strategic management refers to the process of identifying and executing the organization's mission by matching its capabilities with the demands of its environment."
  },
  {
    "question_number": 4,
    "type": "mcq",
    "question": "Which function of the management process requires a manager to establish goals and\nstandards and to develop rules and procedures?",
    "options": [
      "planning",
      "organizing",
      "staffing",
      "leading"
    ],
    "correct": "A",
    "explanation": "A) Planning, organizing, staffing, leading, and controlling are the five main functions of management. The planning function involves establishing goals and standards, developing rules and procedures, and forecasting."
  },
  {
    "question_number": 5,
    "type": "mcq",
    "question": "Claire spends most of her time at work establishing goals for her staff of fifty employees and\ndeveloping procedures for various tasks. In which function of the management process does\nClaire spend most of her time?",
    "options": [
      "leading",
      "controlling",
      "organizing",
      "planning"
    ],
    "correct": "D",
    "explanation": "D) The planning function of the management process requires managers to establish goals and standards, develop rules and procedures, and develop plans and forecast."
  },
  {
    "question_number": 6,
    "type": "mcq",
    "question": "Jolene, a manager, delegates the authority for a project to Lee, her subordinate. Jolene is most\nlikely involved in which function of the management process?",
    "options": [
      "staffing",
      "organizing",
      "motivating",
      "leading"
    ],
    "correct": "B",
    "explanation": "B) The organizing function of the management process includes delegating authority to subordinates and establishing channels of communication. The organizing function also includes establishing departments and coordinating the work of subordinates."
  },
  {
    "question_number": 7,
    "type": "mcq",
    "question": "When managers use metrics to assess performance and then develop strategies for corrective\naction, they are performing the ________ function of the management process.",
    "options": [
      "planning",
      "leading",
      "controlling",
      "organizing"
    ],
    "correct": "C",
    "explanation": "C) The controlling function of the management process requires managers to set standards such as sales quotas, quality, standards, or production levels. Managers then compare actual performance with the standards, which often involves the use of metrics. Corrective action is then taken when necessary."
  },
  {
    "question_number": 8,
    "type": "mcq",
    "question": "Which function of the management process includes selecting employees, setting performance\nstandards, and compensating employees?",
    "options": [
      "organizing",
      "planning",
      "motivating",
      "staffing"
    ],
    "correct": "D",
    "explanation": "D) The staffing function of the management process determines what type of people you should hire, recruiting prospective employees, selecting employees, training and developing employees, setting performance standards, evaluating performance, counseling employees, compensating employees."
  },
  {
    "question_number": 9,
    "type": "mcq",
    "question": "Larry, a manager at a commercial real estate firm, has established a monthly sales quota for\nhis sales team. Which basic function of management best describes Larry's actions?",
    "options": [
      "planning",
      "organizing",
      "controlling",
      "staffing"
    ],
    "correct": "C",
    "explanation": "C) The controlling function involves setting standards such as sales quotas, quality standards or production levels; checking to see how actual performance compares with these standards; taking corrective action, as needed."
  },
  {
    "question_number": 10,
    "type": "mcq",
    "question": "________ is the process of acquiring, training, appraising, and compensating employees, and\nattending to their labor relations, health and safety, and fairness concerns.",
    "options": [
      "Labor relations",
      "Human resource management",
      "Behavioral management",
      "Organizational health and safety management"
    ],
    "correct": "B",
    "explanation": "B) Human resource management is the process of acquiring, training, appraising, and compensating employees, and of attending to their labor relations, health and safety, and fairness concerns. HRM falls under the staffing function of the management process."
  },
  {
    "question_number": 11,
    "type": "mcq",
    "question": "In the management process, which of the following is an activity associated with the leading\nfunction?",
    "options": [
      "motivating subordinates",
      "setting performance standards",
      "training new employees",
      "developing procedures"
    ],
    "correct": "A",
    "explanation": "A) The leading function of the management process requires a manager to get others to get the job done; maintaining morale, and motivating subordinates."
  },
  {
    "question_number": 12,
    "type": "mcq",
    "question": "Personnel activities associated with human resource management most likely include all of\nthe following EXCEPT ________.",
    "options": [
      "orienting and training new employees",
      "appraising employee performance",
      "building employee commitment",
      "developing customer relationships"
    ],
    "correct": "D",
    "explanation": "D) Human resource management involves numerous personnel-related activities, and HR managers are less likely to interact with customers. Managing compensation, orienting new employees, appraising employee performance, and developing employee commitment are typical aspects of the HR manager's job."
  },
  {
    "question_number": 13,
    "type": "mcq",
    "question": "Since human resources is important to all managers, which is NOT a personnel mistake a\nmanager wants to avoid making while managing?",
    "options": [
      "waste time with useless interviews",
      "hire the wrong person",
      "have your people not doing their best",
      "experience low turnover"
    ],
    "correct": "D",
    "explanation": "D) Personnel mistakes a manager does not want to make while managing are hiring the wrong person for the job; experience high turnover; have your people not doing their best; waste time with useless interviews; have your company taken to court because of your discriminatory actions; have your company cited under federal occupational safety laws for unsafe practices; have some employees think their salaries are unfair relative to others in the organization; allow a lack of training to undermine your department's effectiveness; commit any unfair labor practices."
  },
  {
    "question_number": 14,
    "type": "mcq",
    "question": "Approximately what percentage of people in the United States work for small firms?",
    "options": [
      "10%",
      "25%",
      "50%",
      "80%"
    ],
    "correct": "C",
    "explanation": "C) More than half the people working in the United States work for small firms. Small businesses as a group also account for most of the 600,000 or so new businesses created every year."
  },
  {
    "question_number": 15,
    "type": "mcq",
    "question": "________ is the right to make decisions, to direct the work of others, and to give orders.",
    "options": [
      "Leadership",
      "Authority",
      "Management",
      "Responsibility"
    ],
    "correct": "B",
    "explanation": "B) The right to make decisions, to direct the work of others, and to give orders is known as authority."
  },
  {
    "question_number": 16,
    "type": "mcq",
    "question": "Which of the following best defines line authority?",
    "options": [
      "management over a small staff in a public firm",
      "management with flexible decision-making powers",
      "a manager's right to advise other managers or employees",
      "a manager's right to issue orders to other managers or employees"
    ],
    "correct": "D",
    "explanation": "D) Line authority is a manager's right to issue orders to other managers or employees, which creates a superior-subordinate relationship. Staff authority refers to a manager's right to advise other managers or employees, which creates an advisory relationship."
  },
  {
    "question_number": 17,
    "type": "mcq",
    "question": "In most organizations, human resource managers are categorized as ________, who assist\nand advise ________ in areas like recruiting, hiring, and compensation.",
    "options": [
      "staff managers; line managers",
      "line managers; middle managers",
      "line managers; staff managers",
      "functional managers; staff managers"
    ],
    "correct": "A",
    "explanation": "A) Human resource managers are usually staff managers. They assist and advise line managers in areas like recruiting, hiring, and compensation. However, line managers still have human resource duties."
  },
  {
    "question_number": 18,
    "type": "mcq",
    "question": "Gerard is authorized to direct the work of subordinates and is responsible for accomplishing\nthe organization's tasks. Gerard is most likely a ________.",
    "options": [
      "training specialist",
      "staff manager",
      "line manager",
      "recruiter"
    ],
    "correct": "C",
    "explanation": "C) A line manager is authorized to direct the work of subordinates and is responsible for accomplishing the organization's tasks. Unlike line managers, staff managers lack the authority to issue orders down the chain of command. Recruiters and training specialists are specialties within the HR department, and HR managers are usually staff managers rather than line managers."
  },
  {
    "question_number": 19,
    "type": "mcq",
    "question": "Which of the following is NOT considered one of the line supervisor's responsibilities for\neffective human resources management under the general headings outlined by a major company\ndiscussed in the textbook?",
    "options": [
      "protecting employees' health and physical condition",
      "changing employees' attitudes regarding work",
      "developing the abilities of each person",
      "interpreting the company policies and procedures"
    ],
    "correct": "B",
    "explanation": "B) The direct handling of people has always been part of every line manager's duties, from the president down to first-line supervisors. One major company outlines its line supervisor's responsibilities for effective human resource management under these general headings: placing the right person in the right job; starting new employees in the organization (orientation); training employees for jobs that are new to them; improving the job performance of each person; gaining cooperation, and developing smooth working relationships; interpreting the company's policies and procedures; controlling labor costs; developing the abilities of each person; creating and maintaining department morale; protecting employees' health and physical condition."
  },
  {
    "question_number": 20,
    "type": "mcq",
    "question": "A line manager's human resource responsibilities most likely include all of the following\nEXCEPT ________.",
    "options": [
      "maintaining department morale",
      "controlling labor costs",
      "protecting employees' health",
      "marketing new products and services"
    ],
    "correct": "D",
    "explanation": "D) Human resource management most often involves creating and maintaining department morale, controlling labor costs, and protecting employees' health and physical condition. Handling personnel is an integral part of every line manager's duties, but marketing new products is not a personnel issue and would be handled by the marketing department."
  },
  {
    "question_number": 21,
    "type": "mcq",
    "question": "Which of the following refers to the authority a manager has to advise other managers or\nemployees?",
    "options": [
      "staff authority",
      "line authority",
      "functional authority",
      "corporate authority"
    ],
    "correct": "C",
    "explanation": "C) Staff authority refers to a manager's right to advise other managers or employees, which creates an advisory relationship."
  },
  {
    "question_number": 22,
    "type": "mcq",
    "question": "Which of the following is most likely a line function of the human resource manager?",
    "options": [
      "ensuring that line managers are implementing HR policies",
      "advising top managers about how to implement EEO laws",
      "representing the interests of employees to senior management",
      "directing the activities of subordinates in the HR department"
    ],
    "correct": "D",
    "explanation": "D) Directing members of the HR staff is a line function."
  },
  {
    "question_number": 23,
    "type": "mcq",
    "question": "One of the ________ functions of a human resource manager includes directing the activities\nof his or her subordinates in the HR department.",
    "options": [
      "coordinative",
      "corporate",
      "staff",
      "line"
    ],
    "correct": "D",
    "explanation": "D) Line functions and staff functions are the distinct functions of HR managers. Examples of line functions include a human resource manager directing the activities of the people in his or her own department."
  },
  {
    "question_number": 24,
    "type": "mcq",
    "question": "Will works at a position in his organization where he maintain contacts within the local\ncommunity and travels to search for qualified job applicants. Will's position is best described as:",
    "options": [
      "recruiter",
      "manager",
      "labor relations specialist",
      "job analyst"
    ],
    "correct": "A",
    "explanation": "A) The recruiter maintains contacts within the community and perhaps travels extensively to search for qualified job applicants."

const letters = ['A','B','C','D','E','F'];
let current = 0;
let score = 0;
let answered = new Array(QUESTIONS.length).fill(null); // null | 'correct' | 'wrong'
const music = document.getElementById('bg-music');
const musicBtn = document.getElementById('music-btn');

musicBtn.addEventListener('click', () => {

    if (music.paused) {
        music.play();
        musicBtn.textContent = "⏸ Pause Music";
    } else {
        music.pause();
        musicBtn.textContent = "🎵 Play Music";
    }

});

function getCorrectIndex(q) {
  // For MCQ: correct is a letter "A","B","C","D"
  // For true/false: correct is "True" or "False" — match by option text
  if (q.type === 'true_false') {
    return q.options.findIndex(o => o === q.correct);
  }
  return letters.indexOf(q.correct.toUpperCase());
}

function jumpQuestions(offset) {
    current += offset;

    if (current < 0) current = 0;
    if (current >= QUESTIONS.length)
        current = QUESTIONS.length - 1;

    render();
}

function jumpToQuestion() {
    const val = parseInt(document.getElementById('jump-input').value);

    if (isNaN(val)) return;

    current = Math.min(
        Math.max(val - 1, 0),
        QUESTIONS.length - 1
    );

    render();
}

function render() {
  const card = document.getElementById('card');
  const total = QUESTIONS.length;

  if (current >= total) {
    renderScore(card, total);
    return;
  }

  const q = QUESTIONS[current];
  const correctIdx = getCorrectIndex(q);
  const alreadyAnswered = answered[current];

  document.getElementById('prog-text').textContent = `Question ${current + 1} of ${total}`;
  document.getElementById('score-text').textContent = `Score: ${score}`;
  document.getElementById('progress-fill').style.width = `${((current) / total) * 100}%`;

  let expClass = '';
  if (alreadyAnswered === 'correct') expClass = 'correct-exp show';
  else if (alreadyAnswered === 'wrong')  expClass = 'wrong-exp show';

  const optionsHTML = q.options.map((opt, i) => {
    let cls = '';
    if (alreadyAnswered) {
      if (i === correctIdx) cls = 'correct';
      else if (alreadyAnswered === 'wrong' && answered[current + '_chosen'] === i) cls = 'wrong';
    }
    return `
      <li>
        <button class="option-btn ${cls}" data-index="${i}" ${alreadyAnswered ? 'disabled' : ''}>
          <span class="option-letter">${q.type === 'true_false' ? (i === 0 ? 'T' : 'F') : letters[i]}</span>
          ${opt}
        </button>
      </li>`;
  }).join('');

  card.innerHTML = `
    <div class="q-meta">
      <span class="q-badge ${q.type === 'true_false' ? 'tf' : ''}">${q.type === 'true_false' ? 'True / False' : 'MCQ'}</span>
      <span class="q-number">Q${q.question_number}</span>
    </div>
    <p class="question-text">${q.question}</p>
    <ul class="options-list">${optionsHTML}</ul>
    <div class="explanation ${expClass}">
      <strong>${alreadyAnswered === 'correct' ? '✓ Correct!' : alreadyAnswered === 'wrong' ? '✗ Incorrect' : ''}</strong>
      ${q.explanation}
    </div>
    <div class="nav">
      <button class="btn btn-prev" id="btn-prev" ${current === 0 ? 'disabled' : ''}>← Prev</button>
      <button class="btn btn-next" id="btn-next" ${!alreadyAnswered ? 'disabled' : ''}>
        ${current === total - 1 ? 'Finish ✓' : 'Next →'}
      </button>
    </div>
  `;

  // Option click handlers
  card.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const chosen = parseInt(btn.dataset.index);
      const isCorrect = chosen === correctIdx;
      answered[current] = isCorrect ? 'correct' : 'wrong';
      answered[current + '_chosen'] = chosen;
      if (isCorrect) score++;
      render();
    });
  });

  document.getElementById('btn-prev').addEventListener('click', () => { current--; render(); });
  document.getElementById('btn-next').addEventListener('click', () => { current++; render(); });
}

function renderScore(card, total) {
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('prog-text').textContent = `Done!`;
  document.getElementById('score-text').textContent = `Score: ${score}`;

  const pct = Math.round((score / total) * 100);
  let emoji = pct >= 80 ? '🎉' : pct >= 55 ? '💪' : '📚';
  let msg   = pct >= 80 ? 'Great work!' : pct >= 55 ? 'Keep it up!' : 'Keep studying!';

  card.innerHTML = `
    <div class="score-screen">
      <div class="score-emoji">${emoji}</div>
      <div class="score-title">${msg}</div>
      <div class="score-num">${pct}%</div>
      <div class="score-sub">${score} correct out of ${total} questions</div>
      <button class="btn btn-restart" onclick="restart()">Try Again</button>
    </div>
  `;
}

function restart() {
  current = 0;
  score = 0;
  answered = new Array(QUESTIONS.length).fill(null);
  render();
}

render();
</script>
